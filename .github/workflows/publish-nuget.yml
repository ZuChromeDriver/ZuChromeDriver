name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version (empty = use Version from ZuChromeDriver.csproj)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        shell: bash
        run: |
          mkdir -p artifacts
          pack_args="-c Release -o artifacts -p:GeneratePackageOnBuild=false"
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            dotnet pack ZuChromeDriver/ZuChromeDriver.csproj $pack_args \
              -p:Version="${{ steps.version.outputs.value }}" \
              -p:PackageVersion="${{ steps.version.outputs.value }}"
          else
            dotnet pack ZuChromeDriver/ZuChromeDriver.csproj $pack_args
          fi

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not configured; skipping nuget.org."
            exit 0
          fi
          # Pushing .nupkg also uploads the matching .snupkg from the same folder.
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/ZuChromeDriver/index.json \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages-published
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          retention-days: 30
