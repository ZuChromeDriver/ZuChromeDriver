name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack NuGet package
        run: dotnet pack ZuChromeDriver/ZuChromeDriver.csproj -c Release -o artifacts -p:GeneratePackageOnBuild=false

      - name: Verify package contents
        run: |
          test -f artifacts/ZuChromeDriver.*.nupkg
          test -f artifacts/ZuChromeDriver.*.snupkg
          unzip -l artifacts/ZuChromeDriver.*.nupkg | grep -q 'lib/net10.0/ZuChromeDriver.dll'
          unzip -l artifacts/ZuChromeDriver.*.nupkg | grep -q 'lib/net10.0/ChromeDevToolsClient.dll'

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 7
